name: dependabatch

on:
  schedule:
    # Run once every weekday at 06:00 UTC
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview without opening PR)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run dependabatch
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: run
          dry_run: ${{ inputs.dry_run == true && 'true' || 'false' }}

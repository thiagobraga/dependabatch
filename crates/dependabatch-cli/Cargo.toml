[package]
name = "dependabatch-cli"
description = "CLI for dependabatch: batch dependabot PRs into one superseding PR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dependabatch"
path = "src/main.rs"

# Short alias, installed alongside `dependabatch`.
[[bin]]
name = "dbatch"
path = "src/bin/dbatch.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
dependabatch-core = { path = "../dependabatch-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

name: 'dependabatch'
description: 'Collect open Dependabot PRs into one superseding batch PR'
branding:
  icon: 'git-pull-request'
  color: 'blue'

inputs:
  token:
    description: 'GitHub token with contents:write and pull-requests:write permissions'
    required: false
    default: ${{ github.token }}
  command:
    description: 'dbatch command to run: run or scan'
    required: false
    default: 'run'
  repo:
    description: 'Target repo (defaults to current git checkout / github.repository)'
    required: false
    default: ''
  base:
    description: 'Base branch to fork the batch from'
    required: false
    default: ''
  exclude:
    description: 'Comma-separated dependency names to keep out of the batch'
    required: false
    default: ''
  dry_run:
    description: 'Print plan and preview without opening PR'
    required: false
    default: 'false'
  no_regen:
    description: 'Skip lockfile regeneration'
    required: false
    default: 'false'
  regen_image:
    description: 'Docker image for lockfile regeneration'
    required: false
    default: 'node:24'
  version:
    description: 'dependabatch release version to install (defaults to latest)'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install dependabatch
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          curl -fsSL https://raw.githubusercontent.com/thiagobraga/dependabatch/main/install.sh | sh
        else
          DEPENDABATCH_VERSION="${{ inputs.version }}" curl -fsSL https://raw.githubusercontent.com/thiagobraga/dependabatch/main/install.sh | sh
        fi
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Run dependabatch
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        ARGS=()
        if [ -n "${{ inputs.base }}" ]; then
          ARGS+=(--base "${{ inputs.base }}")
        fi
        if [ -n "${{ inputs.exclude }}" ]; then
          IFS=',' read -ra EXCLUDES <<< "${{ inputs.exclude }}"
          for item in "${EXCLUDES[@]}"; do
            trimmed="$(echo "$item" | xargs)"
            if [ -n "$trimmed" ]; then
              ARGS+=(--exclude "$trimmed")
            fi
          done
        fi
        if [ "${{ inputs.dry_run }}" = "true" ]; then
          ARGS+=(--dry-run)
        fi
        if [ "${{ inputs.no_regen }}" = "true" ]; then
          ARGS+=(--no-regen)
        fi
        if [ -n "${{ inputs.regen_image }}" ] && [ "${{ inputs.regen_image }}" != "node:24" ]; then
          ARGS+=(--regen-image "${{ inputs.regen_image }}")
        fi
        if [ -n "${{ inputs.repo }}" ]; then
          ARGS+=("${{ inputs.repo }}")
        fi

        dbatch "${{ inputs.command }}" "${ARGS[@]}"
